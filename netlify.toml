[build]
  functions = "netlify/functions"
  publish = "."

# 公开读取产品（GET /api/products 或 /api/products?id=xxx）
[[redirects]]
  from = "/api/products"
  to = "/.netlify/functions/products"
  status = 200
  force = false

# 后台增删改（POST /api/admin，密码验证）
[[redirects]]
  from = "/api/admin"
  to = "/.netlify/functions/admin"
  status = 200
  force = false

# SPA 风格回退：未匹配的路径回退到对应静态文件（可选）
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
